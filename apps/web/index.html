<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: the on-screen keyboard shrinks the page, so bottom bars stay above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Errandipity</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the last known theme before first paint. The database is the source of
      // truth; this cached copy only prevents a flash while settings load.
      // Keep in step with apply() in src/theme.ts. The key holds all the settings, not only the theme.
      (function () {
        try {
          var hint = JSON.parse(localStorage.getItem('errandipity-theme') || 'null');
          var theme =
            !hint || hint.matchSystem
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : hint.theme;
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-page text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
