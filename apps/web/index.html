<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Errandipity</title>
    <script>
      // Apply the last known theme before first paint. The database is the source of
      // truth; this cached copy only prevents a flash while settings load.
      (function () {
        try {
          var hint = JSON.parse(localStorage.getItem('errandipity-theme') || 'null');
          var dark =
            !hint || hint.matchSystem
              ? matchMedia('(prefers-color-scheme: dark)').matches
              : hint.theme === 'dark';
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
